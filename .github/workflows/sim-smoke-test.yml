# Re-run only the simulator smoke test against the app built by an earlier
# "Simulator build" run, without rebuilding:
#   gh workflow run sim-smoke-test.yml -R leewsimpson/ManicEMU -f run_id=<build run id>
# The smoke test script comes from the branch this workflow is run from.

name: Simulator smoke test

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: ID of the Simulator build run whose "app" artifact to test
        required: true

permissions:
  actions: read
  contents: read

jobs:
  smoke-test:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Check out scripts
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github
          lfs: false

      - name: Download app
        uses: actions/download-artifact@v4
        with:
          name: app
          path: ${{ runner.temp }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Unpack app
        run: tar -xzf "$RUNNER_TEMP/ManicEmuSimulator.app.tar.gz" -C "$RUNNER_TEMP"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - name: Launch in simulator
        run: |
          bash .github/scripts/sim-smoke-test.sh \
            "$RUNNER_TEMP/ManicEmuSimulator.app" "$RUNNER_TEMP/simulator"

      - name: Upload simulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator
          path: ${{ runner.temp }}/simulator
          if-no-files-found: ignore
          retention-days: 14
