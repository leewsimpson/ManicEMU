# Unsigned device build of the ManicEmuSideload scheme (SideloadRelease),
# published as a pre-release with the .ipa attached. Sign and install it with
# SideStore, AltStore or Sideloadly.
#
# Run it for a branch:
#   gh workflow run sideload-release.yml -R leewsimpson/ManicEMU -f ref=<branch>

name: Sideload release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build (defaults to the selected branch)
        required: false

concurrency:
  group: sideload-release-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    # The app uses iOS 27.1 SDK APIs (UIHinge), which need Xcode 27.1+.
    runs-on: xcode-27
    timeout-minutes: 150
    env:
      SPM_DIR: ${{ github.workspace }}/.build/spm
      DERIVED_DATA: ${{ github.workspace }}/.build/DerivedData
      REF: ${{ inputs.ref || github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive
          lfs: false

      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > "$RUNNER_TEMP/lfs-ids"

      - name: Restore LFS cache
        id: lfs-cache
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles(format('{0}/lfs-ids', runner.temp)) }}
          restore-keys: lfs-

      - name: Pull LFS objects
        run: git lfs pull

      - name: Save LFS cache
        if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/lfs
          key: ${{ steps.lfs-cache.outputs.cache-primary-key }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - name: Restore Swift package cache
        id: spm-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SPM_DIR }}
          key: spm-${{ hashFiles('ManicEmu/ManicEmu.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ManicEmu/ManicEmu.xcodeproj \
            -scheme ManicEmuSideload \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -skipPackagePluginValidation \
            -skipMacroValidation

      - name: Save Swift package cache
        if: steps.spm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SPM_DIR }}
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}

      - name: Restore DerivedData cache
        uses: actions/cache/restore@v4
        with:
          # Must match the save step's path exactly.
          path: |
            ${{ env.DERIVED_DATA }}
            !${{ env.DERIVED_DATA }}/Logs
          key: dd-sideload-${{ env.REF }}-${{ github.sha }}
          restore-keys: |
            dd-sideload-${{ env.REF }}-
            dd-sideload-

      - name: Prepare incremental build
        run: |
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
          bash .github/scripts/set-mtimes.sh "$DERIVED_DATA"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project ManicEmu/ManicEmu.xcodeproj \
            -scheme ManicEmuSideload \
            -configuration SideloadRelease \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -derivedDataPath "$DERIVED_DATA" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            | xcbeautify --renderer github-actions
          git rev-parse HEAD > "$DERIVED_DATA/.source-sha"

      - name: Save DerivedData cache
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.DERIVED_DATA }}
            !${{ env.DERIVED_DATA }}/Logs
          key: dd-sideload-${{ env.REF }}-${{ github.sha }}

      - name: Package IPA
        id: ipa
        run: |
          APP="$DERIVED_DATA/Build/Products/SideloadRelease-iphoneos/ManicEmuSideload.app"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          SHA="$(git rev-parse --short HEAD)"
          NAME="ManicEMU-${VERSION}-${REF//\//-}-${SHA}"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/$NAME.ipa" Payload)
          ls -lh "$RUNNER_TEMP/$NAME.ipa"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/$NAME.ipa" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="sideload-${{ steps.ipa.outputs.name }}"
          gh release create "$TAG" "${{ steps.ipa.outputs.path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ steps.ipa.outputs.sha }}" \
            --prerelease \
            --title "Sideload test build: $REF (${{ steps.ipa.outputs.version }})" \
            --notes "Unsigned SideloadRelease build of \`$REF\` at ${{ steps.ipa.outputs.sha }}. Not an official Manic EMU release. Sign and install with SideStore, AltStore or Sideloadly."
