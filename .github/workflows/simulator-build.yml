# Unsigned iOS Simulator build of the ManicEmuSimulator scheme.
#
# Runs on every push to a branch that contains this file. For a branch that
# doesn't (one cut from upstream/main for a PR), run it from this branch and
# pass the branch to build:
#   gh workflow run simulator-build.yml -R leewsimpson/ManicEMU -f ref=<branch>

name: Simulator build

on:
  push:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build (defaults to the selected branch)
        required: false

concurrency:
  group: simulator-build-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      SPM_DIR: ${{ github.workspace }}/.build/spm
      DERIVED_DATA: ${{ github.workspace }}/.build/DerivedData
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive
          lfs: false

      # LFS bandwidth is metered, so keep the objects in the Actions cache and
      # only download what changed.
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-ids

      - name: Restore LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-

      - name: Pull LFS objects
        run: git lfs pull

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Restore Swift package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SPM_DIR }}
          key: spm-${{ hashFiles('ManicEmu/ManicEmu.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project ManicEmu/ManicEmu.xcodeproj \
            -scheme ManicEmuSimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/build.xcresult" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-xcresult
          path: ${{ runner.temp }}/build.xcresult
          retention-days: 7
